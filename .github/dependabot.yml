version: 2

# Dependabot обновляет только то, от чего действительно зависит сборка:
# экшены в workflow и dev-зависимости (html-validate, jsdom).
# Приложение остаётся одним файлом без рантайм-зависимостей.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    labels: ['dependencies', 'github-actions']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      # Один PR на все dev-зависимости: пакетов мало, шум не нужен.
      dev-dependencies:
        patterns: ['*']
        dependency-type: development
