name: GUIPBX CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ── 1. Тесты Go ─────────────────────────────────────────────
  go-test:
    name: Go · gofmt + vet + тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: gofmt (информационно)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::Файлы не по gofmt: $unformatted"
          fi

      - name: go vet
        run: go vet ./... 2>&1 | tee vet.log; exit ${PIPESTATUS[0]}

      - name: go test
        run: go test ./... -count=1 -v 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Отчёт о падении в issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').slice(-9000) : '(нет файла)';
            const body = [
              '## ❌ CI: падение Go-тестов',
              `Ветка: \`${context.ref}\` · коммит: \`${context.sha}\``,
              '```', read('vet.log') + '\n' + read('test.log'), '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `CI fail: Go-тесты @ ${context.sha.slice(0, 8)}`,
              body, labels: ['ci'],
            });

  # ── 2. Smoke-тест веб-интерфейса на живом Go-бинарнике ──────
  ui-smoke:
    name: Web UI · smoke против Go-сервера
    needs: go-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Сборка guipbx
        run: go build -trimpath -o guipbx . 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Запуск сервера
        run: |
          PORT=3100 GUIPBX_NOBROWSER=1 nohup ./guipbx > guipbx.log 2>&1 &
          echo $! > guipbx.pid
          ok=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3100/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "Сервер не поднялся"; cat guipbx.log; exit 1; }

      - name: Самопроверка JS-компилятора (dev)
        run: npm run selftest

      - name: UI smoke
        run: node scripts/ui-smoke.js http://localhost:3100 2>&1 | tee smoke.log; exit ${PIPESTATUS[0]}

      - name: Отчёт о падении в issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').slice(-9000) : '(нет файла)';
            const body = [
              '## ❌ CI: падение UI smoke',
              `Ветка: \`${context.ref}\` · коммит: \`${context.sha}\``,
              '```', read('build.log') + '\n' + read('guipbx.log') + '\n' + read('smoke.log'), '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `CI fail: UI smoke @ ${context.sha.slice(0, 8)}`,
              body, labels: ['ci'],
            });

      - name: Остановка сервера
        if: always()
        run: |
          [ -f guipbx.pid ] && kill "$(cat guipbx.pid)" 2>/dev/null || true
          [ -f guipbx.log ] && tail -20 guipbx.log || true

  # ── 3. Бинарники под все платформы ──────────────────────────
  binaries:
    name: Бинарник · ${{ matrix.target }}
    needs: ui-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64,   goos: linux,   goarch: amd64 }
          - { target: linux-arm64,   goos: linux,   goarch: arm64 }
          - { target: windows-amd64, goos: windows, goarch: amd64 }
          - { target: darwin-amd64,  goos: darwin,  goarch: amd64 }
          - { target: darwin-arm64,  goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Версия
        id: ver
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: Сборка
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p dist
          bin="guipbx-${{ matrix.target }}"
          [ "${{ matrix.goos }}" = "windows" ] && bin="${bin}.exe"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "dist/${bin}" .
          cd dist && sha256sum "${bin}" > "${bin}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: guipbx-${{ matrix.target }}
          path: dist/*
          retention-days: 21
          if-no-files-found: error

  # ── 4. Автопререлиз «nightly» с main ────────────────────────
  release:
    name: Релиз nightly (main)
    needs: binaries
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: guipbx-*
          path: dist
          merge-multiple: true

      - name: Что в релизе
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: GUIPBX nightly
          prerelease: true
          files: dist/*
          body: |
            Автосборка из ветки main (${{ github.sha }}).
            GUIPBX — визуальный конструктор сценариев Asterisk: рисуй карту → получай рабочий диалплан,
            читай настройки со станции и сохраняй обратно.
