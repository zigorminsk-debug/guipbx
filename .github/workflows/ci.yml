name: CI

# Автосборка FlowPBX: линт разметки → сборка dist/ → смоук-тест → артефакт → GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Линт, сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование
        uses: actions/checkout@v4
        with:
          # Полная история нужна, чтобы сборка могла прочитать коммит и ветку.
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Линт исходной разметки
        run: npm run lint

      - name: Сборка dist/
        run: npm run build

      - name: Линт собранной страницы
        run: npm run lint:dist

      - name: Смоук-тест интерфейса
        run: npm test

      - name: Сводка в отчёт о запуске
        run: |
          {
            echo "## FlowPBX — сборка готова"
            echo ""
            jq -r '"**v\(.version)** · коммит `\(.commit)` · ветка `\(.branch)` · \(.builtAt)"' dist/manifest.json
            echo ""
            echo "| Файл | Размер | sha256 |"
            echo "| --- | ---: | --- |"
            jq -r '.files[] | "| `\(.path)` | \((.bytes / 1024 * 10 | floor) / 10) КБ | `\(.sha256[0:12])` |"' dist/manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт dist/
        uses: actions/upload-artifact@v4
        with:
          name: flowpbx-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Артефакт для GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    name: Публикация на GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Если сайт Pages ещё не создан, создаём его с источником «GitHub Actions».
      # Так публикация начинает работать без ручного похода в настройки репозитория.
      - name: Проверка и включение GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages уже включён"
          elif gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages включён автоматически (источник: GitHub Actions)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Включите GitHub Pages вручную: Settings → Pages → Source: GitHub Actions"
          fi

      - name: Деплой
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
