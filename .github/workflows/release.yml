name: Release

# Релиз по тегу: собирает dist/, прогоняет проверки и публикует GitHub Release
# с архивом и автономным index.html (страница работает без сервера).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация релиза
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверки и сборка
        run: npm run verify

      - name: Определение версии
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Упаковка файлов релиза
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release
          cp dist/index.html "release/flowpbx-${TAG}.html"
          (cd dist && zip -qr "../release/flowpbx-${TAG}-dist.zip" .)
          ls -l release/

      - name: Публикация GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          jq -r --arg tag "$TAG" '
            "FlowPBX \($tag): автономный UI-прототип конструктора маршрутов Asterisk.",
            "",
            "* `flowpbx-\($tag).html` — скачайте и откройте в браузере, сервер не нужен.",
            "* `flowpbx-\($tag)-dist.zip` — результат сборки (`dist/`) с манифестом и сжатыми копиями.",
            "",
            "Собрано из коммита `\(.commit)`, версия `v\(.version)`, дата \(.builtAt)."
          ' dist/manifest.json > release-notes.md
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FlowPBX ${TAG}" \
            --notes-file release-notes.md
